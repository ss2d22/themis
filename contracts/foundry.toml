[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
solc_version = "0.8.30"
evm_version = "prague"
network = "monad"
optimizer = true
optimizer_runs = 10_000
via_ir = true
bytecode_hash = "none"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 5_000

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[lint]
lint_on_build = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
